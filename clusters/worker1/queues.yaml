apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu", "ephemeral-storage"]
    flavors:
    - name: gke-t4-gpu
      resources:
      - name: cpu
        nominalQuota: 1000
      - name: memory
        nominalQuota: 4000Gi
      - name: nvidia.com/gpu
        nominalQuota: 32
      - name: ephemeral-storage
        nominalQuota: 8000Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: user-queue
  namespace: default
spec:
  clusterQueue: cluster-queue
